<!-- Custom logout page for the LEGEND event display. Based on Panel's
     default logout.html; must keep the form action (".{{ LOGIN_ENDPOINT }}")
     so the button leads back to the login page (cookies are already cleared
     server-side by Panel's LogoutHandler before this renders). -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>LEGEND Event Display | Logout</title>
    <link
      rel="icon"
      type="image/png"
      href="https://legend-exp.org/typo3conf/ext/sitepackage/Resources/Public/Favicons/android-chrome-96x96.png"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        height: 100%;
      }
      body {
        font-family: "Segoe UI", sans-serif;
        font-size: 1em;
        height: 100%;
        line-height: 1.6;
      }
      .wrap {
        align-items: center;
        background: #f8f8fa;
        display: flex;
        height: 100%;
        justify-content: center;
        width: 100%;
      }
      .login-form {
        background: #ffffff;
        border: 1px solid #ddd;
        border-radius: 8px;
        box-shadow: 0 2px 12px rgba(26, 42, 91, 0.08);
        margin: 0 auto;
        padding: 2.5em 2em;
        text-align: center;
        width: 360px;
      }
      #logo {
        max-width: 220px;
        height: auto;
        margin-bottom: 1em;
      }
      .login-form p {
        color: #1a2a5b;
        padding-bottom: 1em;
      }
      .form-button {
        background: #1a2a5b;
        border: 1px solid #1a2a5b;
        border-radius: 4px;
        color: #ffffff;
        cursor: pointer;
        padding: 10px;
        text-transform: uppercase;
        width: 100%;
      }
      .form-button:hover {
        background: #24356f;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <form class="login-form" action=".{{ LOGIN_ENDPOINT }}" method="get">
        <img
          id="logo"
          src="https://legend-exp.org/typo3conf/ext/sitepackage/Resources/Public/Images/Logo/logo_legend_tag_next.svg"
          alt="LEGEND"
        />
        <p>You have signed out of the event display.</p>
        <button class="form-button" type="submit">Sign back in</button>
      </form>
    </div>
  </body>
</html>
